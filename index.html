<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crud Employees</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="show-btn">
      <button
        type="submit"
        value="Submit"
        id="show-button"
        onclick="showpopup()"
        class="btn btn-primary"
      >
        Show
      </button>
    </div>
    <div class="container mt-5" id="container">
      <h2 class="text-center mb-3" id="crud-title">CRUD EMPLOYEES SYSTEM</h2>
      <!-- input form -->
      <form action="" class="mb-4" id="employees-form">
        <div class="form-row grid gap-0 column-gap-1">
          <div class="form-group col-md-4">
            <label for="employee-name">Employee name</label>
            <input
              type="text"
              id="employee-name"
              class="form-control"
              placeholder="Enter name"
              required
            />
          </div>
          <div class="form-group col-md-4">
            <label for="employee-position">Position</label>
            <input
              type="text"
              id="employee-position"
              class="form-control"
              placeholder="Enter position"
              required
            />
          </div>
          <div class="form-group col-md-4">
            <label for="employee-hiredate">Hiredate</label>
            <input
              type="date"
              id="employee-hiredate"
              class="form-control"
              placeholder="Enter hiredate"
              required
            />
          </div>
        </div>
        <input type="hidden" id="editting-index" />
        <button type="submit" id="submit-btn" class="btn btn-primary">
          Add Employee
        </button>
      </form>
      <!-- Employee table -->
      <table class="table table-bordered">
        <thead>
          <tr>
            <th># Employee ID</th>
            <th>EmpName</th>
            <th>Position</th>
            <th>Hirdate</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="employee-list">
          <!-- list's employees  -->
        </tbody>
      </table>
    </div>
  </body>
  <script src="/action.js"></script>
</html>
